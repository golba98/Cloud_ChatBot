<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A polished private AI companion chat with 18+ consent-first adult roleplay boundaries.">
  <title>Maya After Dark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Companion chats">
      <header class="sidebar-header">
        <div class="sidebar-title-row">
          <div class="brand-block">
            <p class="eyebrow">Private companion</p>
            <h1>Maya After Dark</h1>
          </div>
          <div class="sidebar-actions">
            <div class="avatar avatar-user" aria-label="Your profile"></div>
            <button class="icon-button" type="button" aria-label="New chat" title="New chat">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
            </button>
          </div>
        </div>
        <label class="search-field">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m16.5 16.5 4 4"></path>
          </svg>
          <input type="search" placeholder="Search sweet notes or start fresh" aria-label="Search conversations">
        </label>
        <p class="sidebar-note">18+ only. Consent-first. Say stop or slow down at any time.</p>
      </header>

      <nav class="conversation-list" aria-label="Conversation list">
        <button class="conversation-item active" type="button" aria-current="true">
          <span class="avatar avatar-contact" aria-hidden="true">M</span>
          <span class="conversation-main">
            <span class="conversation-top">
              <span class="conversation-name">Maya</span>
              <time class="conversation-time" id="sidebar-time">09:42</time>
            </span>
            <span class="conversation-bottom">
              <span class="status-dot" aria-hidden="true"></span>
              <span class="conversation-preview">Soft, flirty, and tuned into your pace.</span>
            </span>
          </span>
        </button>
      </nav>
    </aside>

    <main class="chat-panel" aria-label="Conversation with Maya">
      <header class="chat-header">
        <div class="contact-summary">
          <span class="avatar avatar-contact" aria-hidden="true">M</span>
          <span class="contact-text">
            <span class="contact-name">Maya</span>
            <span class="contact-status">online now • warm, playful, consent-first</span>
          </span>
        </div>
        <div class="chat-actions">
          <button class="icon-button" type="button" aria-label="Search conversation" title="Search">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m16.5 16.5 4 4"></path>
            </svg>
          </button>
          <button class="icon-button" type="button" aria-label="More options" title="Menu">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </button>
          <button id="clear-btn" class="reset-button" type="button" aria-label="Reset chat" title="Reset chat">Reset</button>
        </div>
      </header>

      <section id="chat-messages" class="message-list" role="log" aria-live="polite" aria-label="Messages"></section>

      <div id="error-container" class="notice hidden" role="alert">
        <span id="error-text">Message could not be sent. Please try again.</span>
        <button id="close-error-btn" class="notice-close" type="button" aria-label="Dismiss message">×</button>
      </div>

      <footer class="composer">
        <div class="consent-card">
          <label class="consent-check">
            <input id="adult-confirmation" type="checkbox">
            <span>I’m 18+ and I want a consensual adult conversation.</span>
          </label>
          <p id="consent-hint" class="consent-hint">Adult chat stays locked until you confirm you are 18+ and want a consensual conversation.</p>
        </div>

        <form id="chat-form" class="composer-form">
          <button class="composer-icon" type="button" aria-label="Mood" title="Mood">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
              <path d="M9 9h.01"></path>
              <path d="M15 9h.01"></path>
            </svg>
          </button>
          <label class="message-input-wrap">
            <textarea
              id="message-input"
              placeholder="Tell Maya what you want more of tonight..."
              maxlength="2000"
              rows="1"
              aria-label="Message Maya"
            ></textarea>
            <span id="char-counter" class="char-counter">0 / 2000</span>
          </label>
          <button id="send-btn" class="send-button" type="submit" aria-label="Send message">
            <span>Send</span>
          </button>
        </form>
      </footer>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>

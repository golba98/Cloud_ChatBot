<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, secure, and modern AI chat application connected to cloud LLMs via Cloudflare Pages.">
  <title>Cloud Chat - Secure AI Assistant</title>
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="M17.5 19A3.5 3.5 0 0 0 21 15.5c0-2.79-2.54-4.5-5-4.5-.42 0-.83.04-1.24.12A7 7 0 0 0 2 9c0 3.76 3.08 6.5 7.5 6.5H12"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
        <div class="logo-text">
          <h1>Cloud Chat</h1>
          <span class="status-indicator">
            <span class="status-dot"></span>
            <span id="provider-badge">Secure Endpoint</span>
          </span>
        </div>
      </div>
      <button id="clear-btn" class="icon-btn" title="Clear Conversation" aria-label="Clear Conversation">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
      </button>
    </header>

    <!-- Chat Messages -->
    <main class="chat-area" id="chat-messages" role="log" aria-live="polite">
      <div class="message assistant-message">
        <div class="avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <div class="message-content">
          <p>Hello! I am your AI assistant. How can I help you today?</p>
        </div>
      </div>
    </main>

    <!-- Error Alert Banner -->
    <div id="error-container" class="error-banner hidden" role="alert">
      <div class="error-content">
        <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span id="error-text">An error occurred while sending your message.</span>
      </div>
      <button id="close-error-btn" class="close-btn" aria-label="Close error message">&times;</button>
    </div>

    <!-- Input Footer -->
    <footer class="app-footer">
      <form id="chat-form" class="input-form">
        <div class="textarea-wrapper">
          <textarea
            id="message-input"
            placeholder="Type a message... (Enter to send, Shift+Enter for new line)"
            maxlength="2000"
            rows="1"
            required
            aria-label="Message text"
          ></textarea>
          <div class="char-counter" id="char-counter">0 / 2000</div>
        </div>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </footer>
  </div>
</body>
</html>
